version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: opscopilot-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-opscopilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opscopilot_pass}
      POSTGRES_DB: ${DB_NAME:-opscopilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
